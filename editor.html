<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIVERSE WORKBENCH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #010102;
            --sidebar: #08080a;
            --panel: #0d0d10;
            --accent: #00f0ff;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --border: rgba(255,255,255,0.07);
            --text: #ffffff;
            --text-dim: #555;
            --glass: rgba(255,255,255,0.02);
            --purple: #bf5af2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ─── Top Bar ─── */
        .top-bar {
            height: 48px;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .studio-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
            background: #000;
        }

        /* ─── Left Sidebar (Layers) ─── */
        .sidebar-left {
            width: 260px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            z-index: 5;
        }

        /* ─── Right Sidebar (Inspector) ─── */
        .sidebar-right {
            width: 300px;
            background: var(--sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            z-index: 5;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h1 {
            font-size: 1rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .sidebar-header h1 span {
            background: var(--accent);
            color: #000;
            font-size: 0.5rem;
            padding: 3px 8px;
            border-radius: 2px;
            text-shadow: none;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        /* ─── Viewport Controls ─── */
        .viewport-controls {
            padding: 8px;
            display: flex;
            justify-content: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border);
        }
        .vp-btn {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .vp-btn:hover, .vp-btn.active { border-color: var(--accent); color: var(--accent); }

        /* ─── Tabs ─── */
        .tabs {
            display: flex;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            padding: 0 10px;
        }
        .tab {
            padding: 14px 12px;
            font-size: 0.6rem;
            text-align: center;
            cursor: pointer;
            opacity: 0.5;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 800;
            border-bottom: 2px solid transparent;
            position: relative;
        }
        .tab.active {
            opacity: 1;
            color: var(--accent);
        }
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #050507;
            position: relative;
        }

        #json-editor {
            flex: 1;
            width: 100%;
            background: #08080a;
            color: #4ade80;
            border: none;
            padding: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .tree-panel {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        /* ─── Properties Panel ─── */
        .props-panel {
            flex: 1;
            background: var(--sidebar);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .props-header-main {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .state-selector {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            max-width: 200px;
        }
        .state-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.6rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .state-btn.active { border-color: var(--accent); color: var(--accent); }

        .props-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* ─── Prop Rows ─── */
        .prop-group { margin-bottom: 20px; }
        .prop-group-title {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .prop-group-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .prop-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .prop-key {
            font-size: 0.65rem;
            color: var(--text-dim);
            width: 120px;
            flex-shrink: 0;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .prop-input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-base {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            padding: 8px 12px;
            font-size: 0.75rem;
            width: 100%;
            outline: none;
            transition: all 0.2s;
        }
        .input-base:hover { background: rgba(255,255,255,0.05); }
        .input-base:focus { border-color: var(--accent); background: rgba(0, 240, 255, 0.05); }

        /* Range Controls */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Button Groups */
        .btn-group {
            display: flex;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
        }
        .btn-group-item {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.6rem;
            padding: 6px 2px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 700;
            border-right: 1px solid var(--border);
        }
        .btn-group-item:last-child { border-right: none; }
        .btn-group-item.active { background: var(--accent); color: #000; }

        /* Box Model UI */
        .box-model {
            position: relative;
            width: 100%;
            height: 120px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: var(--text-dim);
            padding: 10px;
        }
        .box-rect {
            position: relative;
            border: 1px dashed var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box-margin { width: 100%; height: 100%; padding: 20px; background: rgba(217, 119, 6, 0.05); }
        .box-padding { width: 100%; height: 100%; padding: 20px; background: rgba(45, 138, 78, 0.05); border: 1px solid rgba(45, 138, 78, 0.2); }
        .box-inner { width: 40px; height: 20px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent); border-radius: 2px; }
        .box-label { position: absolute; cursor: pointer; transition: color 0.2s; }
        .box-label:hover { color: var(--accent); }
        .box-label.top { top: 4px; left: 50%; transform: translateX(-50%); }
        .box-label.bottom { bottom: 4px; left: 50%; transform: translateX(-50%); }
        .box-label.left { left: 4px; top: 50%; transform: translateY(-50%); }
        .box-label.right { right: 4px; top: 50%; transform: translateY(-50%); }

        /* Floating Toolbar */
        .float-toolbar {
            position: absolute;
            background: #1a1a20;
            border: 1px solid var(--accent);
            border-radius: 6px;
            display: flex;
            gap: 2px;
            padding: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 2000;
            pointer-events: auto;
            transform: translate(-50%, -120%);
        }
        .float-btn {
            background: transparent;
            border: none;
            color: #fff;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .float-btn:hover { background: rgba(255,255,255,0.05); color: var(--accent); }

        /* ─── Tree Nodes ─── */
        .tree-node { margin-left: 12px; position: relative; }
        .tree-node::before {
            content: '';
            position: absolute;
            left: -8px; top: 0; bottom: 0;
            width: 1px; background: var(--border);
        }
        .tree-label {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s;
            gap: 8px;
        }
        .tree-label:hover { background: rgba(255,255,255,0.03); }
        .tree-label.selected {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent);
            box-shadow: inset 2px 0 0 var(--accent);
        }
        .tree-icon { font-size: 0.6rem; opacity: 0.3; width: 14px; text-align: center; }

        /* ─── Preview ─── */
        .preview-area {
            flex: 2;
            background: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .preview-header {
            height: 40px;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }

        .preview-iframe-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: radial-gradient(circle at center, #111, #000);
            overflow: auto;
        }
        .preview-container {
            background: #000;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            border: 1px solid var(--border);
        }
        .preview-container iframe { width: 100%; height: 100%; border: none; display: block; }

        /* ─── Catalog ─── */
        .catalog-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .catalog-modal {
            width: 600px;
            max-height: 80vh;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .catalog-search {
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
        }
        .catalog-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .catalog-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
        }
        .catalog-item:hover { background: rgba(255,255,255,0.05); }

        /* Visual Catalog */
        .visual-catalog {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 4px;
        }
        .catalog-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .catalog-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        .catalog-card-preview {
            height: 60px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .catalog-card-info {
            display: flex;
            flex-direction: column;
        }
        .catalog-card-name {
            font-size: 0.65rem;
            font-weight: 700;
            color: #fff;
        }
        .catalog-card-desc {
            font-size: 0.55rem;
            color: var(--text-dim);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1 style="font-size: 0.8rem; font-weight: 900; letter-spacing: 2px; color: var(--accent);">OMNIVERSE <span style="background:var(--accent); color:#000; padding:2px 6px; font-size:0.5rem; border-radius:2px; vertical-align:middle; margin-left:8px">V10 STUDIO</span></h1>
        <div class="viewport-controls" style="background: transparent; border: none; padding: 0">
            <button class="vp-btn" data-width="375" data-height="667">Mobile</button>
            <button class="vp-btn" data-width="768" data-height="1024">Tablet</button>
            <button class="vp-btn active" data-width="100" data-height="100" data-full="true">Auto</button>
        </div>
        <button class="btn-primary" id="btnSave">Export JSON</button>
    </div>

    <div class="studio-layout">
        <div class="sidebar-left">
            <div class="tabs">
                <div class="tab active" data-tab="visual">Layers</div>
                <div class="tab" data-tab="tokens">Tokens</div>
                <div class="tab" data-tab="templates">Library</div>
            </div>
            <div id="visual-tab" class="tree-panel">
                <div id="tree"></div>
            </div>
            <div id="tokens-tab" class="tree-panel" style="display:none">
                <div id="tokens-tree"></div>
            </div>
            <div id="templates-tab" class="tree-panel" style="display:none">
                <div id="templates-tree"></div>
            </div>

            <!-- Bottom Log -->
            <div style="height: 200px; border-top: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column;">
                <div class="prop-group-title" style="padding: 8px 12px; margin-bottom: 0;">Action Log</div>
                <div id="audit-log" style="flex:1; font-size:0.55rem; font-family:monospace; padding:10px; color:var(--accent); overflow-y:auto; background: rgba(0,0,0,0.2)"></div>
            </div>
        </div>

        <div class="main-content">
            <textarea id="json-editor" style="display:none; position: absolute; inset: 0; z-index: 10;" spellcheck="false"></textarea>

            <div class="preview-area">
                <div class="preview-header">
                    <div id="live-indicator" style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80;"></div>
                    <div id="preview-status" style="font-size: 0.6rem; color: var(--text-dim); flex: 1">Live Performance</div>
                    <div class="tab" data-tab="json" style="padding: 4px 8px; font-size: 0.5rem;">Source Code</div>
                    <div class="tab" data-tab="lab" style="padding: 4px 8px; font-size: 0.5rem;">Laboratory</div>
                </div>
                <div class="preview-iframe-wrap">
                    <div class="preview-container" id="preview-container" style="width:100%; height:100%">
                        <iframe id="preview" src="index.html"></iframe>
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar-right">
            <div class="props-panel" id="props-panel">
                <div class="props-header-main">
                    <div class="props-title" id="selected-name">Inspector</div>
                    <div class="state-selector" id="state-selector" style="display:none">
                        <button class="state-btn active" data-state="base">Base</button>
                        <button class="state-btn" data-state="hover">Hover</button>
                        <button class="state-btn" data-state="active">Active</button>
                        <button class="state-btn" data-state="responsive">Resp</button>
                    </div>
                </div>
                <div id="responsive-bp-selector" style="display:none; padding: 8px 16px; border-bottom: 1px solid var(--border); background: rgba(0, 240, 255, 0.05); gap: 8px; align-items: center;">
                    <select id="bp-select" class="input-base" style="padding: 2px 6px; width: auto; font-size: 0.65rem;">
                        <option value="0">0px (Mobile)</option>
                        <option value="768">768px (Tablet)</option>
                        <option value="1024">1024px (Desktop)</option>
                    </select>
                </div>
                <div class="props-content" id="props-content">
                    <div style="opacity:0.3; font-style:italic; font-size:0.8rem; padding: 20px">Select a layer to inspect</div>
                </div>
            </div>

            <div id="lab-tab" style="display:none; border-top: 1px solid var(--border); background: var(--panel); padding: 12px;">
                 <div class="prop-group">
                    <div class="prop-group-title">Environmental Stats</div>
                    <div style="font-size: 0.65rem; color: var(--text-dim);">
                        Time: <span id="env-time" style="color: var(--accent)">0.0s</span><br>
                        Scroll: <span id="env-scroll" style="color: var(--accent)">0px</span>
                    </div>
                </div>
                <div class="prop-group">
                    <div class="prop-group-title">Data Monitor</div>
                    <pre id="data-inspector" style="font-size: 0.5rem; color: var(--accent); max-height: 150px; overflow: auto;"></pre>
                </div>
            </div>
        </div>
    </div>

    <div class="catalog-overlay" id="catalog-overlay">
        <div class="catalog-modal">
            <div class="catalog-search">
                <input type="text" class="input-base" id="catalog-search-input" placeholder="Buscar propiedad nativa (ej: backdrop-filter, grid-template-columns)...">
            </div>
            <div class="catalog-list" id="catalog-list"></div>
        </div>
    </div>

                    "border": "2px solid #00f0ff", "color": "#00f0ff", "font-weight": "700", "cursor": "pointer",
                    "transition": "all 0.3s",
                    "hover": { "background": "#00f0ff", "color": "#000", "box-shadow": "0 0 20px #00f0ff" }
                }
            },
            'Flex Layout': {
                "icon": "🍱",
                "desc": "Responsive flexbox container",
                "data": {
                    "nombre": "Flex Container",
                    "display": "flex", "gap": "1rem", "padding": "1rem",
                    "child_1": { "width": "50px", "height": "50px", "background": "var(--accent)" },
                    "child_2": { "width": "50px", "height": "50px", "background": "var(--purple)" }
                }
            }
        };

        const RESERVED = { nombre: 1, hover: 1, active: 1, responsive: 1, variables: 1, texto: 1, tagName: 1, animations: 1, _seeds: 1, _template: 1, props: 1, onMount: 1, onUpdate: 1, onClick: 1, onMouseEnter: 1, onMouseLeave: 1, _actions: 1, _seed: 1, _fetch: 1 };

        const TACTILE_BEHAVIORS = {
            'glass': {
                "background": "rgba(255, 255, 255, 0.05)",
                "backdrop-filter": "blur(20px)",
                "border": "1px solid rgba(255, 255, 255, 0.1)",
                "border-radius": "16px",
                "box-shadow": "0 10px 30px rgba(0,0,0,0.2)"
            },
            'glow': {
                "color": "#00f0ff",
                "text-shadow": "0 0 10px rgba(0, 240, 255, 0.8), 0 0 20px rgba(0, 240, 255, 0.4)",
                "border-color": "#00f0ff",
                "box-shadow": "0 0 20px rgba(0, 240, 255, 0.3)"
            },
            'float': {
                "transform": "translateY(math(sin(time * 2) * 10)px)"
            },
            'pulse': {
                "transform": "scale(math(1 + sin(time * 4) * 0.05))"
            },
            'click': {
                "onClick": [
                    { "type": "toggle", "path": "variables.state.active" }
                ],
                "cursor": "pointer"
            },
            'tilt': {
                "transition": "transform 0.1s ease-out",
                "transform": "rotateX(math(my * 20 - 10)deg) rotateY(math(mx * 20 - 10)deg)"
            },
            'hover-grow': {
                "transition": "transform 0.3s ease",
                "hover": { "transform": "scale(1.05)" }
            },
            'rounded': { "border-radius": "1000px" }
        };

        // Professional Native CSS Property Groups
        const NATIVE_GROUPS = {
            'Identidad': ['nombre', 'tagName', 'texto', 'src', 'href'],
            'Layout': ['display', 'flex-direction', 'justify-content', 'align-items', 'flex-wrap', 'gap', 'grid-template-columns', 'grid-template-rows', 'align-self', 'justify-self', 'flex-grow', 'flex-shrink', 'position', 'top', 'left', 'right', 'bottom', 'z-index'],
            'Dimensiones': ['width', 'height', 'min-width', 'max-width', 'min-height', 'max-height', 'padding', 'margin', 'box-sizing'],
            'Tipografía': ['font-family', 'font-size', 'font-weight', 'line-height', 'color', 'text-align', 'letter-spacing', 'text-transform', 'text-decoration'],
            'Efectos': ['background', 'background-image', 'background-size', 'background-position', 'background-repeat', 'border', 'border-radius', 'box-shadow', 'opacity', 'transition', 'transform', 'filter', 'backdrop-filter', 'overflow', 'cursor', 'clip-path']
        };

        const FONT_FAMILIES = [
            "'Inter', sans-serif",
            "'JetBrains Mono', monospace",
            "'Playfair Display', serif",
            "system-ui, -apple-system, sans-serif",
            "'Bebas Neue', cursive"
        ];

        async function init() {
            if (!contentData) {
                try {
                    const res = await fetch('content.json');
                    if (res.ok) contentData = await res.json();
                    else {
                        // Fallback in case of fetch failure in some environments
                        contentData = { nombre: "FALLBACK_WORKSPACE", variables: {}, _seeds: {} };
                    }
                } catch(e) {
                    contentData = { nombre: "FALLBACK_WORKSPACE", variables: {}, _seeds: {} };
                }
            }
            refreshAll();
        }

        function refreshAll() {
            renderTree();
            renderTokens();
            renderTemplates();
            updateJsonEditor();
            sendToPreview();
        }

        function sendToPreview() {
            if (contentData) {
                // Increment version to trigger structural reconciliation in the engine
                contentData._v = (contentData._v || 0) + 1;
            }
            const iframe = document.getElementById('preview');
            iframe.contentWindow.postMessage({ type: 'update-content', content: contentData }, '*');
            updateFloatingToolbar();
        }

        function updateFloatingToolbar() {
            const existing = document.getElementById('floating-toolbar');
            if (existing) existing.remove();

            if (!selectedPath) return;

            // We need to get the position of the selected element from the iframe
            const iframe = document.getElementById('preview');
            iframe.contentWindow.postMessage({ type: 'get-rect', path: selectedPath }, '*');
        }

        window.addEventListener('message', (e) => {
            if (e.data.type === 'rect-result') {
                const { rect, path } = e.data;
                const iframeRect = document.getElementById('preview').getBoundingClientRect();
                const container = document.querySelector('.preview-iframe-wrap');

                let toolbar = document.getElementById('floating-toolbar');
                if (!toolbar) {
                    toolbar = document.createElement('div');
                    toolbar.id = 'floating-toolbar';
                    toolbar.className = 'float-toolbar';
                    document.body.appendChild(toolbar);
                }

                toolbar.style.left = (iframeRect.left + rect.left + rect.width / 2) + 'px';
                toolbar.style.top = (iframeRect.top + rect.top) + 'px';

                const obj = getObjPath(contentData, path);

                toolbar.innerHTML = `
                    <button class="float-btn" id="float-dup">⧉ <span>Duplicate</span></button>
                    <button class="float-btn" id="float-txt">✎ <span>Text</span></button>
                    <button class="float-btn" id="float-del" style="color:#ff4a4a">✕ <span>Delete</span></button>
                `;

                toolbar.querySelector('#float-dup').onclick = () => duplicateNode(path);
                toolbar.querySelector('#float-del').onclick = () => deleteNode(path);
                toolbar.querySelector('#float-txt').onclick = () => {
                    const newTxt = prompt('Edit text:', obj.texto || '');
                    if (newTxt !== null) {
                        obj.texto = newTxt;
                        refreshAll();
                    }
                };
            }
            if (e.data.type === 'canvas-apply-preset') {
                const { path, action } = e.data;
                if (action === 'delete') { deleteNode(path); return; }
                if (action === 'duplicate') { duplicateNode(path); return; }

                const obj = getObjPath(contentData, path);
                const preset = TACTILE_BEHAVIORS[action];
                if (obj && preset) {
                    // Deep merge the preset into the object
                    for (const key in preset) {
                        if (key === 'hover' || key === 'active') {
                            obj[key] = { ...(obj[key] || {}), ...preset[key] };
                        } else if (Array.isArray(preset[key])) {
                            obj[key] = [...(obj[key] || []), ...preset[key]];
                        } else {
                            obj[key] = preset[key];
                        }
                    }
                    refreshAll();
                }
            }
            if (e.data.type === 'sync-data') {
                document.getElementById('data-inspector').textContent = JSON.stringify(e.data.data.state.variables, null, 2);
                document.getElementById('env-time').textContent = e.data.data.state.time?.toFixed(1) + 's' || '0s';
                document.getElementById('env-scroll').textContent = e.data.data.state.scroll + 'px' || '0px';

                // Action Audit Log
                const lab = document.getElementById('lab-tab');
                let audit = document.getElementById('audit-log');
                if (!audit) {
                    const group = document.createElement('div');
                    group.className = 'prop-group';
                    group.innerHTML = `<div class="prop-group-title">Omniverse Audit Log</div><div id="audit-log" style="font-size:0.55rem; font-family:monospace; padding:10px; color:var(--accent); max-height:200px; overflow-y:auto"></div>`;
                    lab.appendChild(group);
                    audit = document.getElementById('audit-log');
                }
                if (e.data.data.actionLog) {
                    audit.innerHTML = e.data.data.actionLog.slice(-50).map(l => `<div>[${new Date(l.time).toLocaleTimeString()}] <span style="color:#fff">${l.type}</span>: ${l.path || l.url || ''} ${l.value || ''}</div>`).reverse().join('');
                }
            }
            if (e.data.type === 'select-node' || e.data.type === 'request-text-edit') {
                selectedPath = e.data.path.replace(/^pagina\./, '').replace(/^pagina$/, '');
                if (selectedPath === 'pagina') selectedPath = '';
                renderTree();
                const obj = getObjPath(contentData, selectedPath);
                renderProperties(obj, selectedPath);

                if (e.data.type === 'request-text-edit' && obj) {
                    const newTxt = prompt('Edit text:', obj.texto || '');
                    if (newTxt !== null) {
                        obj.texto = newTxt;
                        refreshAll();
                    }
                }
            }
            if (e.data.type === 'canvas-update') {
                const { path, updates } = e.data;
                const cleanPath = path.replace(/^pagina\./, '').replace(/^pagina$/, '');
                const obj = getObjPath(contentData, cleanPath);
                if (obj) {
                    Object.assign(obj, updates);
                    renderTree();
                    renderTokens();
                    renderTemplates();
                    updateJsonEditor();
                    sendToPreview();
                }
            }
        });

        function updateJsonEditor() {
            document.getElementById('json-editor').value = JSON.stringify(contentData, null, 4);
        }

        function renderTree() {
            const tree = document.getElementById('tree');
            tree.innerHTML = '';
            tree.appendChild(buildNode(contentData, '', 'pagina'));
        }

        function buildNode(obj, path, key) {
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
            const container = document.createElement('div');
            container.className = 'tree-node';
            const label = document.createElement('div');
            label.className = 'tree-label' + (path === selectedPath ? ' selected' : '');

            const isTemplate = obj && obj._template ? true : false;
            const displayName = (obj && obj.nombre) || key;

            const children = [];
            for (const k in obj) {
                if (typeof obj[k] === 'object' && obj[k] !== null && !RESERVED[k]) {
                    children.push(k);
                }
            }

            label.innerHTML = `
                <span class="tree-icon" style="color:${isTemplate ? '#ff00ff' : 'inherit'}">${children.length ? '▼' : '○'}</span>
                <span style="font-weight:600">${displayName}</span>
                ${isTemplate ? `<span style="font-size:0.5rem; background:#ff00ff; color:#000; padding:1px 4px; border-radius:2px; margin-left:auto; font-weight:900">${obj._template}</span>` : ''}
                <div class="node-actions" style="margin-left: 8px; display:none; gap:4px">
                    <button class="node-btn" data-action="dup" title="Duplicar">⧉</button>
                    <button class="node-btn" data-action="del" title="Eliminar" style="color:#ff4a4a">✕</button>
                </div>
            `;

            label.onmouseenter = () => label.querySelector('.node-actions').style.display = 'flex';
            label.onmouseleave = () => label.querySelector('.node-actions').style.display = 'none';

            label.querySelectorAll('.node-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const action = btn.dataset.action;
                    if (action === 'del') {
                        if (confirm('¿Eliminar este nodo y sus hijos?')) {
                            deleteNode(path);
                        }
                    } else if (action === 'dup') {
                        duplicateNode(path);
                    }
                };
            });

            label.onclick = (e) => {
                e.stopPropagation();
                selectedPath = path;
                renderTree();
                renderProperties(obj, path);

                // Sync to canvas
                const iframe = document.getElementById('preview');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'set-selected', path: selectedPath }, '*');
                }
            };

            container.appendChild(label);
            children.forEach(k => {
                const childPath = path === '' ? k : `${path}.${k}`;
                const childNode = buildNode(obj[k], childPath, k);
                if (childNode) container.appendChild(childNode);
            });
            return container;
        }

        function renderProperties(obj, path) {
            const container = document.getElementById('props-content');
            const stateSelector = document.getElementById('state-selector');
            const bpSelector = document.getElementById('responsive-bp-selector');
            const nameLabel = document.getElementById('selected-name');
            container.innerHTML = '';

            if (!obj) {
                container.innerHTML = '<div style="opacity:0.3; font-style:italic; font-size:0.8rem">Ningún elemento seleccionado</div>';
                stateSelector.style.display = 'none';
                nameLabel.textContent = 'Selecciona un elemento';
                return;
            }

            stateSelector.style.display = 'flex';
            bpSelector.style.display = currentEditingState === 'responsive' ? 'flex' : 'none';
            nameLabel.textContent = obj.nombre || path.split('.').pop();

            // ─── Component Metadata ───
            if (obj._template) {
                const info = document.createElement('div');
                info.style.padding = '8px 12px';
                info.style.marginBottom = '12px';
                info.style.background = 'rgba(191, 90, 242, 0.1)';
                info.style.border = '1px solid rgba(191, 90, 242, 0.2)';
                info.style.borderRadius = '4px';
                info.style.fontSize = '0.65rem';
                info.innerHTML = `<span style="color:var(--purple); font-weight:800">◇ INSTANCIA DE:</span> ${obj._template}`;
                container.appendChild(info);
            }

            let target;
            if (currentEditingState === 'base') target = obj;
            else if (currentEditingState === 'responsive') {
                if (!obj.responsive) obj.responsive = {};
                if (!obj.responsive[currentBreakpoint]) obj.responsive[currentBreakpoint] = {};
                target = obj.responsive[currentBreakpoint];
            } else {
                target = obj[currentEditingState] || {};
            }

            // ─── Inspector: Dynamic Property Detection ───
            const usedKeys = new Set(['_template', 'props', 'responsive', 'hover', 'active', '_seed', '_actions', 'onClick', 'onMount', 'onUpdate', 'onMouseEnter', 'onMouseLeave', '_fetch']);

            for (const groupName in NATIVE_GROUPS) {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'prop-group';
                groupDiv.innerHTML = `<div class="prop-group-title">${groupName}</div>`;
                let hasProps = false;

                if (groupName === 'Dimensiones') {
                    hasProps = true;
                    groupDiv.appendChild(createBoxModelUI(target, obj));
                }

                NATIVE_GROUPS[groupName].forEach(key => {
                    if (['padding', 'margin'].includes(key)) { usedKeys.add(key); return; }
                    usedKeys.add(key);
                    const val = target[key] !== undefined ? target[key] : (currentEditingState === 'base' ? obj[key] : '');
                    if (val !== undefined || groupName === 'Identidad') {
                        hasProps = true;
                        groupDiv.appendChild(createPropRow(key, val, target, obj));
                    }
                });
                if (hasProps) container.appendChild(groupDiv);
            }

            // ─── Inspector: Custom Properties (The "Rest") ───
            const customGroup = document.createElement('div');
            customGroup.className = 'prop-group';
            customGroup.innerHTML = `<div class="prop-group-title">Propiedades Custom</div>`;
            let hasCustom = false;
            for (const key in target) {
                if (!usedKeys.has(key) && typeof target[key] !== 'object') {
                    hasCustom = true;
                    customGroup.appendChild(createPropRow(key, target[key], target, obj));
                }
            }
            if (hasCustom) container.appendChild(customGroup);

            // ─── Toolbox ───
            const actionsGrid = document.createElement('div');
            actionsGrid.style.display = 'grid';
            actionsGrid.style.gridTemplateColumns = '1fr 1fr';
            actionsGrid.style.gap = '8px';
            actionsGrid.style.marginTop = '20px';

            const addPropBtn = document.createElement('button');
            addPropBtn.className = 'btn-primary';
            addPropBtn.textContent = '+ Propiedad';
            addPropBtn.onclick = () => {
                const prop = prompt('Nombre de la propiedad CSS o Custom:');
                if (prop) { target[prop] = ''; renderProperties(obj, path); }
            };
            actionsGrid.appendChild(addPropBtn);

            const addNodeBtn = document.createElement('button');
            addNodeBtn.className = 'btn-primary';
            addNodeBtn.style.background = 'transparent';
            addNodeBtn.style.border = '1px solid var(--accent)';
            addNodeBtn.style.color = 'var(--accent)';
            addNodeBtn.textContent = '+ Nuevo Hijo';
            addNodeBtn.onclick = () => {
                const name = prompt('Nombre de la clave JSON:');
                if (name) {
                    const presetKeys = Object.keys(PRESETS);
                    const choice = prompt(`Elige un preset (opcional): ${presetKeys.join(', ')}`);
                    if (choice && PRESETS[choice]) {
                        obj[name] = JSON.parse(JSON.stringify(PRESETS[choice]));
                        obj[name].nombre = name;
                    } else {
                        obj[name] = { nombre: name };
                    }
                    renderTree(); sendToPreview();
                }
            };
            actionsGrid.appendChild(addNodeBtn);
            container.appendChild(actionsGrid);

            // Seed Selector
            const seedDiv = document.createElement('div');
            seedDiv.className = 'prop-group';
            seedDiv.style.marginTop = '20px';
            seedDiv.innerHTML = `<div class="prop-group-title">Arquitectura (Seeds)</div>`;
            const seedSelect = document.createElement('select');
            seedSelect.className = 'input-base';
            let seedOptions = '<option value="">Sin Arquitectura</option>';
            if (contentData._seeds) {
                for (const sName in contentData._seeds) seedOptions += `<option value="${sName}" ${obj._seed === sName ? 'selected' : ''}>${sName}</option>`;
            }
            seedSelect.innerHTML = seedOptions;
            seedSelect.onchange = () => {
                obj._seed = seedSelect.value;
                if (!obj._seed) delete obj._seed;
                sendToPreview();
            };
            seedDiv.appendChild(seedSelect);
            container.appendChild(seedDiv);
        }

        function createBoxModelUI(target, obj) {
            const container = document.createElement('div');
            container.className = 'box-model';

            const getVal = (prop) => target[prop] || obj[prop] || '0';

            container.innerHTML = `
                <div class="box-rect box-margin">
                    <span style="position:absolute; top:2px; left:4px; opacity:0.3; scale:0.8">MARGIN</span>
                    <div class="box-label top" data-prop="margin-top">${getVal('margin-top')}</div>
                    <div class="box-label bottom" data-prop="margin-bottom">${getVal('margin-bottom')}</div>
                    <div class="box-label left" data-prop="margin-left">${getVal('margin-left')}</div>
                    <div class="box-label right" data-prop="margin-right">${getVal('margin-right')}</div>

                    <div class="box-rect box-padding">
                        <span style="position:absolute; top:2px; left:4px; opacity:0.3; scale:0.8">PADDING</span>
                        <div class="box-label top" data-prop="padding-top">${getVal('padding-top')}</div>
                        <div class="box-label bottom" data-prop="padding-bottom">${getVal('padding-bottom')}</div>
                        <div class="box-label left" data-prop="padding-left">${getVal('padding-left')}</div>
                        <div class="box-label right" data-prop="padding-right">${getVal('padding-right')}</div>
                        <div class="box-inner"></div>
                    </div>
                </div>
            `;

            container.querySelectorAll('.box-label').forEach(label => {
                label.onclick = () => {
                    const prop = label.dataset.prop;
                    const newVal = prompt(`Set ${prop}:`, label.textContent);
                    if (newVal !== null) {
                        target[prop] = newVal;
                        label.textContent = newVal;
                        sendToPreview();
                    }
                };
            });

            return container;
        }

            const row = document.createElement('div');
            row.className = 'prop-row';
            row.style.flexDirection = 'column';
            row.style.alignItems = 'stretch';
            row.style.gap = '4px';

            row.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <div class="prop-key" style="width:auto" title="${key}">${key}</div>
                    <div class="prop-actions" style="display:flex; gap:8px"></div>
                </div>
                <div class="prop-input-wrap" id="wrap-${key.replace(/[^a-zA-Z]/g, '')}"></div>
            `;

            const wrap = row.querySelector('.prop-input-wrap');
            const actions = row.querySelector('.prop-actions');

            // 1. Keyword Selectors (Button Groups)
            const keywordProps = {
                'display': ['block', 'flex', 'grid', 'none'],

            }
        };

            if (keywordProps[key]) {
                const group = document.createElement('div');
                group.className = 'btn-group';
                keywordProps[key].forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-group-item';
                    if (val === opt || val === keywordMap[opt]) btn.classList.add('active');

                if (KEYWORD_ICONS[key] && KEYWORD_ICONS[key][opt]) {
                    btn.innerHTML = KEYWORD_ICONS[key][opt];
                    btn.title = opt;
                } else {
                    btn.textContent = opt;
                }

                    btn.onclick = () => {
                        target[key] = keywordMap[opt] || opt;
                        Array.from(group.children).forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        sendToPreview();
                    };
                    group.appendChild(btn);
                });
                wrap.appendChild(group);
            }
            // 2. Numeric Sliders
            else if (['opacity', 'flex-grow', 'z-index', 'font-weight'].includes(key) || (val && !isNaN(parseFloat(val)) && !val.toString().includes(' '))) {
                const isUnit = typeof val === 'string' && (val.includes('px') || val.includes('rem') || val.includes('%') || val.includes('vh'));
                let unit = isUnit ? val.replace(/[0-9.-]/g, '') : '';
                let numVal = parseFloat(val) || 0;

                const sliderContainer = document.createElement('div');
                sliderContainer.style.display = 'flex';
                sliderContainer.style.flexDirection = 'column';
                sliderContainer.style.gap = '4px';

                const slider = document.createElement('input');
                slider.type = 'range';
                if (key === 'opacity') { slider.min = 0; slider.max = 1; slider.step = 0.05; }
                else if (key === 'font-weight') { slider.min = 100; slider.max = 900; slider.step = 100; }
                else { slider.min = 0; slider.max = 500; slider.step = 1; }
                slider.value = numVal;

                const textInput = document.createElement('input');
                textInput.className = 'input-base';
                textInput.style.padding = '4px 8px';
                textInput.style.fontSize = '0.65rem';
                textInput.value = val || '';

                slider.oninput = () => {
                    numVal = slider.value;
                    textInput.value = target[key] = numVal + unit;
                    sendToPreview();
                };
                textInput.oninput = () => {
                    target[key] = textInput.value;
                    slider.value = parseFloat(textInput.value) || 0;
                    sendToPreview();
                };

                sliderContainer.appendChild(slider);
                sliderContainer.appendChild(textInput);
                wrap.appendChild(sliderContainer);
            }
            // 3. Font Family Picker
            else if (key === 'font-family') {
                const select = document.createElement('select');
                select.className = 'input-base';
                FONT_FAMILIES.forEach(font => {
                    const opt = document.createElement('option');
                    opt.value = font;
                    opt.textContent = font.split(',')[0].replace(/'/g, '');
                    if (val === font) opt.selected = true;
                    select.appendChild(opt);
                });
                select.onchange = () => { target[key] = select.value; sendToPreview(); };
                wrap.appendChild(select);
            }
            // 4. Box Shadow Builder
            else if (key === 'box-shadow') {
                const builder = document.createElement('div');
                builder.style.cssText = 'display:grid; grid-template-columns: 1fr 1fr; gap:4px; width:100%';

                // Parse existing: "0px 10px 20px rgba(0,0,0,0.5)"
                const parts = (val || '0px 0px 0px #000').split(' ');
                const vals = {
                    x: parts[0] || '0px',
                    y: parts[1] || '0px',
                    blur: parts[2] || '0px',
                    color: parts.slice(3).join(' ') || '#000000'
                };

                const createSub = (label, pKey) => {
                    const inp = document.createElement('input');
                    inp.className = 'input-base';
                    inp.style.fontSize = '0.55rem';
                    inp.style.padding = '2px 6px';
                    inp.placeholder = label;
                    inp.value = vals[pKey];
                    inp.oninput = () => {
                        vals[pKey] = inp.value;
                        target[key] = `${vals.x} ${vals.y} ${vals.blur} ${vals.color}`;
                        sendToPreview();
                    };
                    return inp;
                };

                builder.appendChild(createSub('X', 'x'));
                builder.appendChild(createSub('Y', 'y'));
                builder.appendChild(createSub('Blur', 'blur'));

                const cp = document.createElement('input');
                cp.type = 'color';
                cp.style.height = '20px';
                cp.oninput = () => {
                    vals.color = cp.value;
                    target[key] = `${vals.x} ${vals.y} ${vals.blur} ${vals.color}`;
                    sendToPreview();
                };
                builder.appendChild(cp);
                wrap.appendChild(builder);
            }
            // 5. Color Pickers
            else if (key.includes('color') || key === 'background') {
                const input = document.createElement('input');
                input.className = 'input-base';
                input.type = 'text';
                input.value = val || '';

                const cp = document.createElement('input');
                cp.type = 'color';
                cp.style.cssText = 'width:100%; height:24px; border:none; padding:0; background:none; cursor:pointer; margin-top:4px; border-radius:4px';
                if (val && val.toString().startsWith('#')) cp.value = val.slice(0, 7);

                input.oninput = () => { target[key] = input.value; sendToPreview(); };
                cp.oninput = () => { input.value = target[key] = cp.value; sendToPreview(); };

                wrap.appendChild(input);
                wrap.appendChild(cp);
            }
            // 4. Default Text
            else {
                const input = document.createElement('input');
                input.className = 'input-base';
                input.type = 'text';
                input.value = val || '';
                input.oninput = () => { target[key] = input.value; sendToPreview(); };
                wrap.appendChild(input);
            }

            if (!['nombre', 'tagName'].includes(key)) {
                const del = document.createElement('span');
                del.className = 'delete-prop';
                del.style.cssText = 'cursor:pointer; opacity:0.3; font-size:0.6rem';
                del.textContent = '✕ REMOVE';
                del.onclick = () => { delete target[key]; renderProperties(obj, selectedPath); sendToPreview(); };
                actions.appendChild(del);
            }

            return row;
        }

        function renderTokens() {
            const container = document.getElementById('tokens-tree');
            container.innerHTML = '';
            const vars = (contentData && contentData.variables) || {};
            for (const cat in vars) {
                const group = document.createElement('div');
                group.className = 'prop-group';
                group.innerHTML = `<div class="prop-group-title">${cat}</div>`;
                for (const key in vars[cat]) {
                    const row = document.createElement('div');
                    row.className = 'prop-row';
                    row.innerHTML = `<div class="prop-key">${key}</div><input class="input-base" value="${vars[cat][key]}">`;
                    row.querySelector('input').oninput = (e) => { vars[cat][key] = e.target.value; sendToPreview(); };
                    group.appendChild(row);
                }
                container.appendChild(group);
            }
        }

        function renderTemplates() {
            const container = document.getElementById('templates-tree');
            container.innerHTML = '';

            // 1. Visual Catalog Section
            const catalogTitle = document.createElement('div');
            catalogTitle.className = 'prop-group-title';
            catalogTitle.textContent = 'Component Library';
            container.appendChild(catalogTitle);

            const catalogGrid = document.createElement('div');
            catalogGrid.className = 'visual-catalog';

            for (const name in PRESETS) {
                const preset = PRESETS[name];
                const card = document.createElement('div');
                card.className = 'catalog-card';
                card.innerHTML = `
                    <div class="catalog-card-preview">${preset.icon || '✦'}</div>
                    <div class="catalog-card-info">
                        <div class="catalog-card-name">${name}</div>
                        <div class="catalog-card-desc">${preset.desc || ''}</div>
                    </div>
                `;
                card.onclick = () => {
                    if (!selectedPath) return alert('Select a parent node in the Layers tree first');
                    const parent = getObjPath(contentData, selectedPath);
                    const safeName = name.toLowerCase().replace(/\s/g, '_') + '_' + Date.now().toString().slice(-4);
                    parent[safeName] = JSON.parse(JSON.stringify(preset.data));
                    parent[safeName].nombre = name;
                    refreshAll();
                };
                catalogGrid.appendChild(card);
            }
            container.appendChild(catalogGrid);

            // 2. Custom Templates Section
            const temps = (contentData && contentData.templates) || {};
            const customGroup = document.createElement('div');
            customGroup.className = 'prop-group';
            customGroup.innerHTML = `<div class="prop-group-title">User Templates</div>`;
            for (const name in temps) {
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.gap = '4px';
                row.style.marginBottom = '4px';

                const editBtn = document.createElement('button');
                editBtn.className = 'btn-primary';
                editBtn.style.flex = '1';
                editBtn.style.fontSize = '0.6rem';
                editBtn.textContent = name;
                editBtn.onclick = () => {
                    selectedPath = `templates.${name}`;
                    renderProperties(temps[name], selectedPath);
                    renderTree();
                };

                const instBtn = document.createElement('button');
                instBtn.className = 'btn-primary';
                instBtn.style.background = 'transparent';
                instBtn.style.border = '1px solid var(--accent)';
                instBtn.style.color = 'var(--accent)';
                instBtn.textContent = '+';
                instBtn.onclick = () => {
                    if (!selectedPath) return alert('Selecciona un nodo padre primero');
                    const parent = getObjPath(contentData, selectedPath);
                    const instName = `inst_${name}_${Date.now().toString().slice(-4)}`;
                    parent[instName] = { _template: name, nombre: instName };
                    refreshAll();
                };

                row.appendChild(editBtn);
                row.appendChild(instBtn);
                customGroup.appendChild(row);
            }
            container.appendChild(customGroup);
        }

        // Event Handlers
        document.querySelectorAll('.tab').forEach(t => {
            t.onclick = () => {
                const tabId = t.dataset.tab;

                // Handling Logic
                if (tabId === 'json') {
                    const editor = document.getElementById('json-editor');
                    const visible = editor.style.display === 'block';
                    editor.style.display = visible ? 'none' : 'block';
                    if (!visible) updateJsonEditor();
                    return;
                }

                document.querySelectorAll('.tab, .tree-panel, #lab-tab').forEach(el => {
                    if (el.classList.contains('tab')) el.classList.remove('active');
                    else el.style.display = 'none';
                });

                t.classList.add('active');
                const target = document.getElementById(`${tabId}-tab`);
                if (target) target.style.display = (tabId === 'lab') ? 'block' : 'flex';
            };
        });

        document.querySelectorAll('.vp-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const container = document.getElementById('preview-container');
                if (btn.dataset.full) { container.style.width = '100%'; container.style.height = '100%'; }
                else { container.style.width = btn.dataset.width + 'px'; container.style.height = btn.dataset.height + 'px'; }
            };
        });

        document.querySelectorAll('.state-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentEditingState = btn.dataset.state;
                const obj = getObjPath(contentData, selectedPath);
                if (obj) renderProperties(obj, selectedPath);
            };
        });

        document.getElementById('bp-select').onchange = (e) => {
            currentBreakpoint = e.target.value;
            const obj = getObjPath(contentData, selectedPath);
            if (obj) renderProperties(obj, selectedPath);
        };

        function applySeed(seed) {
            if (!selectedPath) return alert('Selecciona un nodo primero');
            const obj = getObjPath(contentData, selectedPath);
            obj._seed = seed;
            renderProperties(obj, selectedPath);
            sendToPreview();
        }

        function deleteNode(path) {
            if (!path) return;
            const parts = path.split('.');
            const key = parts.pop();
            const parentPath = parts.join('.');
            const parent = getObjPath(contentData, parentPath);
            if (parent && parent[key]) {
                delete parent[key];
                if (selectedPath === path) selectedPath = null;
                renderTree();
                sendToPreview();
            }
        }

        function duplicateNode(path) {
            const parts = path.split('.');
            const key = parts.pop();
            const parentPath = parts.join('.');
            const parent = getObjPath(contentData, parentPath);
            let newKey = key + '_copy';
            let i = 1;
            while (parent[newKey]) {
                newKey = key + '_copy_' + i;
                i++;
            }
            parent[newKey] = JSON.parse(JSON.stringify(parent[key]));
            renderTree();
            sendToPreview();
        }

        function getObjPath(obj, path) {
            if (!path || path === '') return obj;
            return path.split('.').reduce((o, i) => o[i], obj);
        }

        document.getElementById('json-editor').oninput = (e) => {
            try {
                contentData = JSON.parse(e.target.value);
                refreshAll();
            } catch(err) {}
        };

        document.getElementById('btnSave').onclick = () => {
            const blob = new Blob([JSON.stringify(contentData, null, 4)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'content.json';
            a.click();
        };

        init();
    </script>
</body>
</html>
